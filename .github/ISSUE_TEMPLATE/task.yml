name: Task
description: A plan task (one issue, one branch, one PR)
title: "[N.M] "
labels: []
body:
  - type: input
    id: plan
    attributes:
      label: Plan reference
      description: Phase and task number in docs/IMPLEMENTATION_PLAN.md
      placeholder: "Phase 1 · Task 1.4"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [feat, fix, chore, docs, ci, refactor, test, spike]
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: "engine, storage, protocol, browser, extension, desktop, ui, platform-linux, ci, docs"
  - type: textarea
    id: subtasks
    attributes:
      label: Sub-tasks
      description: Copy the checklist from the plan file and keep both in sync.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Exit evidence
      description: Checks, tests or measurements that prove the task is done.
