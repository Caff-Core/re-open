[package]
name = "reopen-agent"
description = "Re-Open background agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reopen-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reopen-core.workspace = true
reopen-platform.workspace = true
reopen-platform-linux.workspace = true
reopen-protocol.workspace = true
reopen-storage.workspace = true
rustix = { version = "1.1.5", features = ["process"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
uuid = "1.29.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
